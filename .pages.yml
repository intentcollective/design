# =========================================================
# Pages CMS configuration
# ---------------------------------------------------------
# Pages CMS (https://pagescms.org) reads this file and turns
# the JSON files in portfolio/content into simple forms.
# Sign in at app.pagescms.org with GitHub, open this
# repository, and edit. Every save is a commit to GitHub.
#
# This file must stay at the top level of the repository.
# =========================================================

media:
  input: portfolio/images      # where uploads are saved in the repo
  output: images               # how the path is written into content
  categories: [image, video]

content:

  # ---------- Projects ----------
  - name: projects
    label: Projects
    type: collection
    path: portfolio/content/projects
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields: [title, discipline]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: discipline, label: Discipline, type: string, description: "For example Poster, Typography" }
      - { name: summary, label: One-line summary, type: text, description: "What the project is and why it matters, in one sentence. This is what reviewers read first." }
      - { name: subject, label: Subject, type: string, description: "The class, client or competition" }
      - { name: tools, label: Tools, type: string }
      - { name: role, label: Role, type: string, description: "Group projects only. What you did on the team." }
      - { name: cover, label: Cover image, type: image }
      - { name: coverAlt, label: Cover description, type: string, description: "Describe the image for people who can't see it." }
      - { name: hideCover, label: Hide the cover on the project page, type: boolean, description: "For example when a video opens the page" }
      - { name: coverPosition, label: Cover crop position, type: select, options: { values: [center, top, bottom, left, right] } }
      - name: blocks
        label: Page blocks
        type: block
        list: true
        blockKey: type
        blocks:
          - name: text
            label: Text
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: body, label: Text, type: text, description: "Blank line for a new paragraph. *italic*, **bold**, [link](https://...)" }
          - name: image
            label: Image
            fields:
              - { name: src, label: Image, type: image }
              - { name: alt, label: Description, type: string }
              - { name: width, label: Width, type: select, options: { values: [full, wide, narrow] }, description: "full is 12 columns, wide 8, narrow 6" }
              - { name: background, label: Background color, type: string, description: "Optional, for example #efefed" }
              - { name: caption, label: Caption, type: string }
          - name: gallery
            label: Gallery
            fields:
              - { name: columns, label: Images per row, type: select, options: { values: ["2", "3", "4"] } }
              - { name: ratio, label: Crop ratio, type: string, description: "Optional, for example 4/5 or 1/1" }
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - { name: src, label: Image, type: image }
                  - { name: alt, label: Description, type: string }
              - { name: caption, label: Caption, type: string }
          - name: video
            label: Video
            fields:
              - { name: url, label: "Vimeo or YouTube link, or an .mp4 file path", type: string }
              - { name: width, label: Width, type: select, options: { values: [wide, full] } }
              - { name: ratio, label: Ratio, type: string, description: "16/9 unless your video is a different shape" }
              - { name: autoplay, label: Autoplay silently (mp4 only), type: boolean }
              - { name: caption, label: Caption, type: string }
          - name: quote
            label: Quote
            fields:
              - { name: text, label: Quote, type: text }
              - { name: cite, label: Who said it, type: string }
          - name: compare
            label: Before and after
            fields:
              - { name: before, label: Before image, type: image }
              - { name: beforeAlt, label: Before description, type: string }
              - { name: after, label: After image, type: image }
              - { name: afterAlt, label: After description, type: string }
              - { name: caption, label: Caption, type: string }
          - name: placeholder
            label: Placeholder
            fields:
              - { name: label, label: What goes here, type: text }
              - { name: ratio, label: Ratio, type: string }
          - name: spacer
            label: Spacer
            fields:
              - { name: size, label: Size, type: select, options: { values: [small, medium, large] } }

  # ---------- Site settings ----------
  - name: settings
    label: Site settings
    type: file
    path: portfolio/content/settings.json
    format: json
    fields:
      - { name: name, label: Your name, type: string }
      - { name: role, label: Role, type: string }
      - { name: location, label: Location, type: string }
      - { name: email, label: Email, type: string }
      - { name: linkedin, label: LinkedIn link, type: string }
      - { name: website, label: Website address, type: string, description: "Printed in the PDF portfolio" }
      - { name: headline, label: Header lines, type: string, list: true, description: "One big line each. Write {rotate} on its own line to show the changing words." }
      - { name: rotatingWords, label: Changing words, type: string, list: true }
      - { name: intro, label: Intro under the header, type: text }
      - name: menu
        label: Menu
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: link, label: Link, type: string, description: "A page like resume.html or a full web address" }
          - { name: newTab, label: Open in a new tab, type: boolean }
          - { name: badge, label: Show as an outlined mark, type: boolean, description: "For a short label like in" }
          - { name: fullName, label: Full name for screen readers, type: string, description: "For example LinkedIn, when the label is in" }
      - { name: works, label: Projects in order, type: string, list: true, description: "The file name of each project, without .json. Drag to reorder. Remove a line to hide a project." }
      - { name: resumePdf, label: Resume PDF, type: file }
      - { name: portfolioPdf, label: Portfolio PDF, type: file }
      - name: theme
        label: Theme
        type: object
        fields:
          - { name: background, label: Background color, type: string }
          - { name: text, label: Text color, type: string }
          - { name: muted, label: Secondary text color, type: string }
          - { name: line, label: Line color, type: string }
          - { name: gridLine, label: Grid line color, type: string }
          - { name: accent, label: Accent color, type: string }
          - { name: font, label: Typeface, type: string }
          - { name: googleFont, label: Load typeface from Google Fonts, type: boolean }
      - { name: showGrid, label: Draw the column grid behind the page, type: boolean }
      - { name: showGuideLink, label: Show template guide link in footer, type: boolean }

  # ---------- About ----------
  - name: about
    label: About page
    type: file
    path: portfolio/content/about.json
    format: json
    fields:
      - { name: portrait, label: Portrait, type: image }
      - { name: portraitAlt, label: Portrait description, type: string }
      - { name: lead, label: Opening line, type: text }
      - name: blocks
        label: Sections
        type: object
        list: true
        fields:
          - { name: type, label: Type, type: string, hidden: true, default: text }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Text, type: text }

  # ---------- Resume ----------
  - name: resume
    label: Resume
    type: file
    path: portfolio/content/resume.json
    format: json
    fields:
      - { name: summary, label: Summary, type: text }
      - { name: availability, label: Availability, type: string }
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - { name: title, label: Section title, type: string }
          - name: items
            label: Entries
            type: object
            list: true
            fields:
              - { name: what, label: Title or position, type: string }
              - { name: where, label: Where, type: string }
              - { name: when, label: When, type: string }
              - { name: details, label: Details, type: string, list: true }
      - name: skills
        label: Skills
        type: object
        list: true
        fields:
          - { name: title, label: Group, type: string }
          - { name: list, label: Skills, type: string }
